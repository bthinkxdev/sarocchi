{% if cities %}
<div class="mt-4 p-3 border rounded shadow-sm" style="background: linear-gradient(to bottom right, #ffffff, #f8f9fa);">
    <div class="d-flex align-items-start gap-3">
        <div class="mt-1 flex-shrink-0" style="width: 24px;">
            <svg style="width: 24px; height: 24px; color: #0369a1;" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M3 12l2-2m0 0l7-7 7 7M5 10v10a1 1 0 001 1h3m10-11l2 2m-2-2v10a1 1 0 01-1 1h-3m-6 0a1 1 0 001-1v-4a1 1 0 011-1h2a1 1 0 011 1v4a1 1 0 001 1m-6 0h6"></path>
            </svg>
        </div>
        <div class="flex-grow-1 w-100">
            <h4 class="h6 fw-bold mb-1" style="font-size: 0.95rem; color: #212529;">Estimated Delivery</h4>
            <div class="position-relative mt-2">
                <select id="pdp-delivery-city" class="form-select shadow-sm" style="font-size: 0.9rem;">
                    <option value="" disabled selected>Select your city...</option>
                    {% for city in cities %}
                        <option value="{{ city.pk }}">{{ city.name }}</option>
                    {% endfor %}
                </select>
            </div>
            
            <div id="pdp-delivery-result" class="mt-2 d-none" style="font-size: 0.85rem; font-weight: 500;">
                <span id="pdp-delivery-text"></span>
            </div>
            <div id="pdp-delivery-default" class="mt-2 text-muted" style="font-size: 0.85rem;">
                {{ default_estimated_delivery_text|default:"Delivery in 2-5 Business Days" }}
            </div>
        </div>
    </div>
</div>

<script>
document.addEventListener("DOMContentLoaded", function() {
    const citySelect = document.getElementById('pdp-delivery-city');
    if (!citySelect) return;
    
    const resultDiv = document.getElementById('pdp-delivery-result');
    const defaultDiv = document.getElementById('pdp-delivery-default');
    const textSpan = document.getElementById('pdp-delivery-text');
    
    //check for saved city in localStorage to pre-fill
    const savedCityId = localStorage.getItem('sarocchi_delivery_city_id');
    if (savedCityId) {
        const option = citySelect.querySelector(`option[value="${savedCityId}"]`);
        if (option) {
            citySelect.value = savedCityId;
            fetchEstimate(savedCityId);
        }
    }

    citySelect.addEventListener('change', function() {
        const cityId = this.value;
        if (cityId) {
            localStorage.setItem('sarocchi_delivery_city_id', cityId);
            fetchEstimate(cityId);
        }
    });
    
    function fetchEstimate(cityId) {
        fetch(`/delivery/api/estimate/?city_id=${cityId}`)
            .then(response => response.json())
            .then(data => {
                if (data.estimated_delivery_text) {
                    textSpan.innerHTML = `<span class="text-success d-flex align-items-center"><svg style="width: 16px; height: 16px; margin-right: 6px;" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M5 13l4 4L19 7"></path></svg>${data.estimated_delivery_text}</span>`;
                } else {
                    textSpan.innerHTML = `<span>{{ default_estimated_delivery_text|default:"Delivery in 2-5 Business Days" }}</span>`;
                }
                defaultDiv.classList.add('d-none');
                resultDiv.classList.remove('d-none');
                resultDiv.classList.add('animate-fade-in');
            })
            .catch(error => console.error('Error fetching delivery estimate:', error));
    }
});
</script>

<style>
@keyframes fadeIn {
    from { opacity: 0; transform: translateY(-4px); }
    to { opacity: 1; transform: translateY(0); }
}
.animate-fade-in {
    animation: fadeIn 0.3s ease-out forwards;
}
</style>
{% endif %}
